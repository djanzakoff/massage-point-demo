<body>
<div class="app" id="app">
  <div class="aura a1"></div><div class="aura a2"></div><div class="aura a3"></div>

  <main class="main">

    </section>
  </main>
  <footer class="bottom"><div class="stepcount" id="count">01 / 08</div><div class="bar"><span id="progress"></span></div><div class="actions"><button type="button" class="back" id="backBtn">← Назад</button><button type="button" class="next" id="nextBtn">Продолжить <span>↗</span></button></div></footer>
</div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), scene=$('#scene'),story=$('#story'),controls=$('#stageControls'),app=$('#app'),canvas=$('#glCanvas');
const state={step:0,name:'Александр',phone:'+7 900 123-45-67',mood:0,pressure:3,zones:new Set(['Плечи']),extras:new Set(),sound:'Тихая музыка',talk:'Предпочитаю тишину',sent:false};
